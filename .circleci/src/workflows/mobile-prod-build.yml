when: << pipeline.parameters.run-mobile-prod-build-workflow >>
jobs:
  - mobile-init:
      context: Audius Mobile Client

  - mobile-build-production-ios:
      context:
        - Audius Mobile Client
      requires:
        - mobile-init

  - mobile-build-production-android:
      context:
        - Audius Mobile Client
      requires:
        - mobile-init

