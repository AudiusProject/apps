when: << pipeline.parameters.run-mobile-workflow >>
jobs:
  - mobile-init:
      context: Audius Mobile Client

  # Staging builds disabled - staging environment has been dropped
  - mobile-build-staging-ios:
      context: Audius Mobile Client
      requires:
        - mobile-init
      filters:
        branches:
          only: /^__STAGING_DISABLED__$/

  - mobile-build-upload-staging-ios:
      context:
        - Audius Mobile Client
        - slack-secrets
      requires:
        - mobile-init
      filters:
        branches:
          only: /^__STAGING_DISABLED__$/

  - mobile-build-upload-releasecandidate-ios:
      context:
        - Audius Mobile Client
        - slack-secrets
      requires:
        - mobile-init
      filters:
        branches:
          only: /(^release.*)$/

  # Staging release candidate disabled - staging environment has been dropped
  - mobile-build-upload-staging-releasecandidate-ios:
      context:
        - Audius Mobile Client
        - slack-secrets
      requires:
        - mobile-init
      filters:
        branches:
          only: /^__STAGING_DISABLED__$/

  - mobile-build-upload-production-ios-if-full-release:
      context:
        - Audius Mobile Client
        - slack-secrets
      requires:
        - mobile-init
      filters:
        branches:
          only: /(^release.*)$/

  # Staging builds disabled - staging environment has been dropped
  - mobile-build-staging-android:
      context: Audius Mobile Client
      requires:
        - mobile-init
      filters:
        branches:
          only: /^__STAGING_DISABLED__$/

  - mobile-build-upload-staging-android:
      context:
        - Audius Mobile Client
        - slack-secrets
      requires:
        - mobile-init
      filters:
        branches:
          only: /^__STAGING_DISABLED__$/

  - mobile-build-upload-releasecandidate-android:
      context:
        - Audius Mobile Client
        - slack-secrets
      requires:
        - mobile-init
      filters:
        branches:
          only: /(^release.*)$/

  # Staging release candidate disabled - staging environment has been dropped
  - mobile-build-upload-staging-releasecandidate-android:
      context:
        - Audius Mobile Client
        - slack-secrets
      requires:
        - mobile-init
      filters:
        branches:
          only: /^__STAGING_DISABLED__$/

  - mobile-build-upload-production-android-if-full-release:
      context:
        - Audius Mobile Client
        - slack-secrets
      requires:
        - mobile-init
      filters:
        branches:
          only: /(^release.*)$/

  - mobile-hold-deploy-saga-dapp-store:
      type: approval
      requires:
        - mobile-init
      filters:
        branches:
          only: /(^release.*)$/

  - mobile-deploy-saga-dapp-store:
      context:
        - Audius Mobile Client
        - slack-secrets
      requires:
        - mobile-hold-deploy-saga-dapp-store
      filters:
        branches:
          only: /(^release.*)$/
