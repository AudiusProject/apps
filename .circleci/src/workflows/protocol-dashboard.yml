when: << pipeline.parameters.run-protocol-dashboard-workflow >>
jobs:
  - protocol-dashboard-init:
      context:
        - Vercel
  # Staging builds disabled - staging environment has been dropped
  - protocol-dashboard-build-staging:
      context:
        - Vercel
      requires:
        - protocol-dashboard-init
      filters:
        branches:
          only: /^__STAGING_DISABLED__$/
  - protocol-dashboard-deploy-staging:
      context:
        - Audius Client
      requires:
        - protocol-dashboard-build-staging
      filters:
        branches:
          only: /^__STAGING_DISABLED__$/
  - protocol-dashboard-build-prod:
      context:
        - Vercel
      requires:
        - protocol-dashboard-init
  - protocol-dashboard-hold-deploy-prod:
      type: approval
      requires:
        - protocol-dashboard-build-prod
      filters:
        branches:
          only: /(^main|^release.*)$/
  - protocol-dashboard-deploy-prod:
      context:
        - Audius Client
      requires:
        - protocol-dashboard-hold-deploy-prod
      filters:
        branches:
          only: /(^main|^release.*)$/
