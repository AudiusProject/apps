name: Publish Packages

on:
  push:
    branches:
      - main
      - rj-manual-publish
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  changes:
    name: Check for changes to public packages
    runs-on: ubuntu-latest
    outputs:
      public-packages: ${{ steps.filter.outputs.public-packages }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            public-packages:
              - '.changeset/**'
              - 'packages/create-audius-app/**'
              - 'packages/fixed-decimal/**'
              - 'packages/harmony/**'
              - 'packages/libs/**'
              - 'packages/sdk/**'
              - 'packages/sp-actions/**'
              - 'packages/spl/**'
              - 'packages/eth/**'

  publish-packages:
    name: Publish Packages to NPM
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.public-packages == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Check wildcard dependencies
        run: bash ./scripts/check-wildcard-deps.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          registry-url: "https://registry.npmjs.org"
          always-auth: true

      - name: Upgrade npm for OIDC support
        run: |
          echo "Current npm version: $(npm --version)"
          # OIDC trusted publishing requires npm 11.5.1+
          npm install -g npm@latest
          echo "Updated npm version: $(npm --version)"

      - name: Create concatenated patch file
        id: patch-file
        run: |
          ls -d -- packages/*/patches/*.patch 2>/dev/null | xargs cat > combined-patch-file.txt || touch combined-patch-file.txt
          echo "patch_checksum=$(sha256sum combined-patch-file.txt | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/web/node_modules
            packages/harmony/node_modules
            packages/common/node_modules
            packages/libs/node_modules
            packages/sdk/node_modules
          key: npm-cache-${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-${{ steps.patch-file.outputs.patch_checksum }}
          restore-keys: |
            npm-cache-${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies (if cache miss)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        env:
          CI: true
          SKIP_POD_INSTALL: true
          SKIP_ANDROID_INSTALL: true
          ANDROID_HOME: /tmp/android-sdk-dummy
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          mkdir -p /tmp/android-sdk-dummy
          # Clear npm cache to avoid EEXIST conflicts
          npm cache clean --force || true
          # Try npm ci first, fallback to npm install if lock file is out of sync
          npm ci --prefer-offline || npm install --prefer-offline

      - name: Verify OIDC Authentication
        run: |
          echo "Checking npm authentication..."
          # Ensure NPM_TOKEN doesn't interfere with OIDC
          if [ -n "$NPM_TOKEN" ]; then
            echo "WARNING: NPM_TOKEN is set - this may interfere with OIDC"
            echo "Unsetting NPM_TOKEN to ensure OIDC is used"
            unset NPM_TOKEN
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "✓ NODE_AUTH_TOKEN is set (OIDC token)"
            echo "Token length: ${#NODE_AUTH_TOKEN}"
          else
            echo "✗ WARNING: NODE_AUTH_TOKEN is not set - OIDC authentication failed"
          fi
          echo "Checking .npmrc..."
          if [ -f "$HOME/.npmrc" ]; then
            echo "✓ .npmrc exists at $HOME/.npmrc"
            # Don't print the full token, just confirm it exists
            if grep -q "registry.npmjs.org" "$HOME/.npmrc"; then
              echo "✓ .npmrc contains registry.npmjs.org configuration"
              # Check if it's using OIDC (should have //registry.npmjs.org/:_authToken)
              if grep -q "//registry.npmjs.org/:_authToken" "$HOME/.npmrc"; then
                echo "✓ .npmrc appears to be configured for OIDC"
              fi
            fi
          else
            echo "✗ WARNING: .npmrc not found at $HOME/.npmrc"
            echo "Creating .npmrc with OIDC token..."
            if [ -n "$NODE_AUTH_TOKEN" ]; then
              echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
              echo "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
              echo "always-auth=true" >> "$HOME/.npmrc"
              echo "✓ Created .npmrc with OIDC token"
            else
              echo "✗ Cannot create .npmrc - NODE_AUTH_TOKEN is not set"
            fi
          fi
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"
        env:
          # Explicitly unset NPM_TOKEN if it exists
          NPM_TOKEN: ""

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bash ./scripts/publish-packages.sh
          version: bash ./scripts/version-packages.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicitly unset NPM_TOKEN to ensure OIDC is used
          NPM_TOKEN: ""
          CI: true

      - name: Generate Slack Payload
        if: steps.changesets.outputs.published == 'true'
        id: generate-slack-payload
        run: |
          echo '${{ steps.changesets.outputs.publishedPackages }}' > /tmp/packages.json
          bash ./scripts/publish-packages-slack-template.sh
          echo "payload=$(cat /tmp/publish-packages-template.json)" >> $GITHUB_OUTPUT

      - name: Notify Slack channel
        id: slack
        uses: slackapi/slack-github-action@v1.26.0
        if: steps.changesets.outputs.published == 'true'
        with:
          channel-id: "C03EK0C69QD"
          payload: ${{ steps.generate-slack-payload.outputs.payload }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
