services:
  api:
    container_name: api
    image: audius/api:latest
    restart: unless-stopped
    # "missing" lets local dev override audius/api:latest with a
    # locally-built image (e.g. when iterating on the Go api) without
    # compose clobbering it on each `up` via a pull from the registry.
    # First bring-up still pulls if the image isn't present locally.
    pull_policy: missing
    profiles:
      - discovery
    depends_on:
      db:
        condition: service_healthy
      api-elasticsearch:
        condition: service_healthy
    ports:
      - 1323:1323
    command:
      ["/bin/sh", "-c", "bridge es-indexer drop && runMigrations=true bridge"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - network.host=0.0.0.0
      - discovery.type=single-node
      - cluster.name=docker-cluster
      - node.name=cluster1-node1
      - xpack.license.self_generated.type=basic
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9200:9200
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 20
