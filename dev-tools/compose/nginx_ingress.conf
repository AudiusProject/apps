#
# ETH, POA, SOL
#
server {
    listen      80;
    server_name audius-eth-ganache-1;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream audius-eth-ganache-1:8545;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen      80;
    server_name audius-solana-test-validator-1;

    location / {
        try_files /nonexistent @$http_upgrade;
    }

    location @websocket {
        resolver 127.0.0.11 valid=30s;
        set $upstream audius-solana-test-validator-1:8900;
        proxy_http_version 1.1;
        proxy_pass http://$upstream;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location @ {
        resolver 127.0.0.11 valid=30s;
        set $upstream audius-solana-test-validator-1:8899;
        proxy_pass http://$upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

