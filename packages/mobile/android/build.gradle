// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        castFrameworkVersion = "21.0.0"
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    // @react-native-firebase defaults to Firebase BoM 34, whose
    // play-services-measurement needs Kotlin 2.2. Stay on 33 until the app is
    // on Kotlin 2.2.
    project.ext.set('react-native', [
        versions: [firebase: [bom: '33.16.0']]
    ])
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// @dr.pogodin/react-native-fs ships its generated module spec but only adds it
// to the build on the new architecture. The module also runs on the bridge, so
// compile the spec on the old architecture too.
subprojects { subproject ->
    if (subproject.name == 'dr.pogodin_react-native-fs' && findProperty('newArchEnabled') != 'true') {
        subproject.plugins.withId('com.android.library') {
            subproject.android.sourceSets.main.java.srcDirs += ["${subproject.projectDir}/generated/java"]
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven { url "$rootDir/../node_modules/react-native/android" }
        maven { url 'https://maven.google.com' }
        maven { url "https://www.jitpack.io" }
        maven { url "https://maven.fpregistry.io/releases" }
        maven { url "https://storage.googleapis.com/snap-kit-build/maven" }
        maven { url "https://artifact.bytedance.com/repository/AwemeOpenSDK" }
        flatDir {
            dirs "$rootDir/libs"
        }
    }
}
